[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-search-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115,<1",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "pydantic>=2.0,<3",
    "python-docx>=1.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.18,<1",
    "requests>=2.31",
    "tavily-python>=0.7,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
norecursedirs = [".*", "build", "dist", "venv", "scripts/manual"]

[tool.setuptools.packages.find]
include = ["app*"]
